<mat-sidenav-container class="container">

    <!-- Sidebar -->

    <mat-sidenav mode="side"
                 opened="true"
                 class="sidebar">

        <div class="logo">

            <h2>SCMS</h2>

        </div>

        <mat-nav-list>

            <a mat-list-item routerLink="/dashboard">
                Dashboard
            </a>

            <a mat-list-item>
                Employees
            </a>

            <a mat-list-item>
                Sales
            </a>

            <a mat-list-item>
                Commission
            </a>

            <a mat-list-item>
                Reports
            </a>

            <a mat-list-item>
                Settings
            </a>

            <a mat-list-item (click)="logout()">
                Logout
            </a>

        </mat-nav-list>

    </mat-sidenav>


    <!-- Main Page -->

    <mat-sidenav-content>

        <mat-toolbar color="primary">

            Sales Commission Management System

            <span class="spacer"></span>

            Welcome Admin

        </mat-toolbar>


        <div class="dashboard-content">

            <mat-card>

                <mat-card-title>

                    Welcome

                </mat-card-title>

                <mat-card-content>

                    Welcome to the Sales Commission
                    Management System.

                    <br><br>

                    Please select a module from
                    the left menu.

                </mat-card-content>

            </mat-card>

        </div>

    </mat-sidenav-content>


</mat-sidenav-container>
